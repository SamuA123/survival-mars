<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Survival Mars</title>
  <meta name="description" content="Entrenador de Misiones para Astronautas Junior — NASA Space Apps Challenge 2026">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="mundo"></div>

  <header class="hud-top">
    <div class="tablero">
      <div class="mision" id="sol"></div>
      <div class="recursos" id="recursos"></div>
    </div>
  </header>

  <nav class="botones-top">
    <button id="btnTarea" class="tarea-btn" title="Lo que pide hoy Control de Misión"></button>
    <button id="btnDatos" class="chip-btn nasa" title="¿Qué es real en este juego?">NASA</button>
    <button id="btnAyudaTuto" class="chip-btn" title="Ver el tutorial otra vez" aria-label="Tutorial">❓</button>
    <button id="btnSonido" class="chip-btn" title="Sonido" aria-label="Sonido">🔊</button>
  </nav>

  <div class="tags" id="tags"></div>

  <aside class="panel" id="panel"></aside>

  <section class="bitacora" id="bitacoraBox">
    <button class="bit-tit" id="btnLog">📓 Bitácora</button>
    <ul id="bitacora"></ul>
  </section>

  <footer class="hud-bottom">
    <button class="btn-base" id="btnBase">🖥️ Control base</button>
    <div class="energia" id="energia"></div>
    <button class="btn-sol" id="btnSol">Terminar el Sol 🌙</button>
  </footer>

  <div id="modal" class="modal oculto"><div class="modal-caja" id="modalCaja"></div></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
